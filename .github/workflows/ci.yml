name: Framework CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality-gate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack (pnpm)
        run: corepack enable

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Run full framework verification gate (build, typecheck, test, architecture, docs)
        run: corepack pnpm check

      - name: Build web, base apps & Node backend
        run: |
          corepack pnpm --filter @framework/base-web build
          corepack pnpm --filter @framework/demo-web build
          corepack pnpm --filter @framework/demo-backend build

      - name: Export Expo Android bundles (base & demo)
        env:
          EXPO_NO_TELEMETRY: '1'
        run: |
          corepack pnpm --filter @framework/base-expo exec expo export --platform android --output-dir /tmp/base-expo-bundle
          corepack pnpm --filter @framework/demo-expo exec expo export --platform android --output-dir /tmp/demo-expo-bundle

